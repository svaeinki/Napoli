<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Bodega - Zapatería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            border: none;
            background: none;
            font-size: 16px;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: white;
            border-bottom: 3px solid #667eea;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        tbody tr:hover {
            background: #f5f5f5;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-bodega {
            background: #ffc107;
            color: #333;
        }

        .status-entregado {
            background: #28a745;
            color: white;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stat-card p {
            opacity: 0.9;
        }

        .ticket {
            display: none;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            .ticket, .ticket * {
                visibility: visible;
            }
            .ticket {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                display: block;
                background: white;
                padding: 30px;
                width: 300px;
                border: 2px solid #000;
            }
        }

        .action-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: #28a745;
            color: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .notification.error {
            background: #dc3545;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .table-container {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="notification" id="notification"></div>

    <div class="container">
        <div class="header">
            <h1>🥾 Sistema de Bodega - Zapatería</h1>
            <p>Gestión profesional de artículos en bodega</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('ingresar')">➕ Ingresar Artículo</button>
            <button class="tab" onclick="showTab('inventario')">📦 Inventario</button>
            <button class="tab" onclick="showTab('buscar')">🔍 Buscar</button>
        </div>

        <div class="content">
            <!-- TAB: INGRESAR ARTÍCULO -->
            <div id="ingresar" class="tab-content active">
                <h2 style="margin-bottom: 20px;">Ingresar Nuevo Artículo</h2>
                <form id="formIngresar" onsubmit="ingresarArticulo(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>RUT Cliente *</label>
                            <input type="text" id="rut" placeholder="Ej: 12345678-9" required>
                        </div>

                        <div class="form-group">
                            <label>Nombre Cliente *</label>
                            <input type="text" id="nombreCliente" placeholder="Nombre completo" required>
                        </div>

                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="tel" id="telefono" placeholder="+56 9 1234 5678">
                        </div>

                        <div class="form-group">
                            <label>Tipo de Artículo *</label>
                            <select id="tipoArticulo" required>
                                <option value="">Seleccione...</option>
                                <option value="Zapatos">Zapatos</option>
                                <option value="Bolso">Bolso</option>
                                <option value="Cartera">Cartera</option>
                                <option value="Cinturón">Cinturón</option>
                                <option value="Maleta">Maleta</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>

                        <div class="form-group full-width">
                            <label>Descripción del Artículo *</label>
                            <textarea id="descripcion" rows="3" placeholder="Ej: Zapatos negros marca XYZ, talla 40, con detalles en cuero" required></textarea>
                        </div>

                        <div class="form-group">
                            <label>Número de Bodega *</label>
                            <input type="text" id="numeroBodega" placeholder="Ej: A-123" required>
                        </div>

                        <div class="form-group">
                            <label>Observaciones</label>
                            <input type="text" id="observaciones" placeholder="Información adicional (opcional)">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">💾 Guardar e Imprimir Ticket</button>
                    <button type="reset" class="btn btn-info">🔄 Limpiar Formulario</button>
                </form>
            </div>

            <!-- TAB: INVENTARIO -->
            <div id="inventario" class="tab-content">
                <h2>Inventario Completo</h2>
                
                <div class="stats">
                    <div class="stat-card">
                        <h3 id="totalArticulos">0</h3>
                        <p>Total Artículos</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="enBodega">0</h3>
                        <p>En Bodega</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="entregados">0</h3>
                        <p>Entregados</p>
                    </div>
                </div>

                <div class="toolbar">
                    <div>
                        <select id="filtroEstado" class="filter-select" onchange="aplicarFiltro()">
                            <option value="todos">Todos los artículos</option>
                            <option value="bodega">Solo en bodega</option>
                            <option value="entregados">Solo entregados</option>
                        </select>
                    </div>
                    <div>
                        <button class="btn btn-info btn-small" onclick="exportarDatos()">📥 Exportar CSV</button>
                        <button class="btn btn-warning btn-small" onclick="limpiarDatos()">🗑️ Limpiar Todo</button>
                    </div>
                </div>

                <div class="table-container" id="tablaInventario"></div>
            </div>

            <!-- TAB: BUSCAR -->
            <div id="buscar" class="tab-content">
                <h2>Buscar Artículos</h2>
                
                <div class="search-box">
                    <input type="text" id="campoBuscar" placeholder="🔍 Buscar por RUT, nombre, número de bodega, tipo de artículo..." oninput="buscarArticulos()">
                </div>

                <div class="table-container" id="resultadosBusqueda"></div>
            </div>
        </div>
    </div>

    <!-- TICKET PARA IMPRIMIR -->
    <div id="ticket" class="ticket">
        <div style="text-align: center; margin-bottom: 15px; border-bottom: 2px dashed #000; padding-bottom: 15px;">
            <h2 style="margin-bottom: 5px;">ZAPATERÍA</h2>
            <p style="font-size: 14px;">Comprobante de Bodega</p>
        </div>
        <div id="ticketContenido" style="line-height: 1.6;"></div>
        <div style="text-align: center; margin-top: 15px; padding-top: 15px; border-top: 2px dashed #000;">
            <p style="font-size: 12px; font-weight: bold;">Conserve este ticket para retirar su artículo</p>
            <p style="font-size: 11px; margin-top: 5px;">Gracias por su confianza</p>
        </div>
    </div>

    <script>
        let articulos = [];
        let contadorId = 1;

        // Cargar datos al iniciar
        window.onload = function() {
            cargarDatos();
            actualizarInventario();
        };

        function cargarDatos() {
            const datosGuardados = localStorage.getItem('articulosZapateria');
            if (datosGuardados) {
                articulos = JSON.parse(datosGuardados);
                contadorId = Math.max(...articulos.map(a => a.id), 0) + 1;
            }
        }

        function guardarEnStorage() {
            localStorage.setItem('articulosZapateria', JSON.stringify(articulos));
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'inventario') {
                actualizarInventario();
            }
        }

        function mostrarNotificacion(mensaje, esError = false) {
            const notif = document.getElementById('notification');
            notif.textContent = mensaje;
            notif.className = 'notification' + (esError ? ' error' : '');
            notif.style.display = 'block';
            
            setTimeout(() => {
                notif.style.display = 'none';
            }, 3000);
        }

        function ingresarArticulo(e) {
            e.preventDefault();

            const nuevoArticulo = {
                id: contadorId++,
                rut: document.getElementById('rut').value.trim(),
                nombreCliente: document.getElementById('nombreCliente').value.trim(),
                telefono: document.getElementById('telefono').value.trim(),
                tipoArticulo: document.getElementById('tipoArticulo').value,
                descripcion: document.getElementById('descripcion').value.trim(),
                numeroBodega: document.getElementById('numeroBodega').value.trim().toUpperCase(),
                observaciones: document.getElementById('observaciones').value.trim(),
                fechaIngreso: new Date().toLocaleString('es-CL'),
                estado: 'En Bodega',
                fechaEntrega: null
            };

            articulos.push(nuevoArticulo);
            guardarEnStorage();
            
            generarTicket(nuevoArticulo);
            document.getElementById('formIngresar').reset();
            
            mostrarNotificacion('✅ Artículo ingresado correctamente. Imprimiendo ticket...');
            
            setTimeout(() => {
                window.print();
            }, 500);
        }

        function generarTicket(articulo) {
            const contenido = `
                <p><strong>Ticket N°:</strong> ${String(articulo.id).padStart(4, '0')}</p>
                <p><strong>Fecha:</strong> ${articulo.fechaIngreso}</p>
                <p style="margin-top: 10px;"><strong>Cliente:</strong> ${articulo.nombreCliente}</p>
                <p><strong>RUT:</strong> ${articulo.rut}</p>
                <p><strong>Teléfono:</strong> ${articulo.telefono || 'No registrado'}</p>
                <p style="margin-top: 10px;"><strong>Tipo:</strong> ${articulo.tipoArticulo}</p>
                <p><strong>Descripción:</strong> ${articulo.descripcion}</p>
                <p style="margin-top: 10px; font-size: 18px;"><strong>Bodega:</strong> <span style="background: #ffc107; padding: 5px 10px; border-radius: 5px;">${articulo.numeroBodega}</span></p>
                ${articulo.observaciones ? `<p><strong>Obs:</strong> ${articulo.observaciones}</p>` : ''}
            `;
            
            document.getElementById('ticketContenido').innerHTML = contenido;
            document.getElementById('ticket').style.display = 'block';
        }

        function actualizarInventario() {
            const totalArticulos = articulos.length;
            const enBodega = articulos.filter(a => a.estado === 'En Bodega').length;
            const entregados = articulos.filter(a => a.estado === 'Entregado').length;

            document.getElementById('totalArticulos').textContent = totalArticulos;
            document.getElementById('enBodega').textContent = enBodega;
            document.getElementById('entregados').textContent = entregados;

            aplicarFiltro();
        }

        function aplicarFiltro() {
            const filtro = document.getElementById('filtroEstado').value;
            let datosFiltrados = articulos;

            if (filtro === 'bodega') {
                datosFiltrados = articulos.filter(a => a.estado === 'En Bodega');
            } else if (filtro === 'entregados') {
                datosFiltrados = articulos.filter(a => a.estado === 'Entregado');
            }

            mostrarTabla(datosFiltrados, 'tablaInventario');
        }

        function mostrarTabla(datos, elementoId) {
            const elemento = document.getElementById(elementoId);
            
            if (datos.length === 0) {
                elemento.innerHTML = '<p style="text-align: center; padding: 40px; color: #999;">No hay artículos para mostrar.</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>RUT</th>
                            <th>Cliente</th>
                            <th>Tipo</th>
                            <th>Descripción</th>
                            <th>N° Bodega</th>
                            <th>Fecha Ingreso</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            datos.forEach(art => {
                html += `
                    <tr>
                        <td><strong>${String(art.id).padStart(4, '0')}</strong></td>
                        <td>${art.rut}</td>
                        <td>${art.nombreCliente}</td>
                        <td>${art.tipoArticulo}</td>
                        <td><small>${art.descripcion}</small></td>
                        <td><strong style="color: #667eea;">${art.numeroBodega}</strong></td>
                        <td><small>${art.fechaIngreso}</small></td>
                        <td><span class="status-badge ${art.estado === 'En Bodega' ? 'status-bodega' : 'status-entregado'}">${art.estado}</span></td>
                        <td class="action-buttons">
                            ${art.estado === 'En Bodega' ? 
                                `<button class="btn btn-success btn-small" onclick="marcarEntregado(${art.id})">✓ Entregar</button>` : 
                                `<button class="btn btn-warning btn-small" onclick="marcarEnBodega(${art.id})">↩ Devolver</button>`
                            }
                            <button class="btn btn-primary btn-small" onclick="reimprimirTicket(${art.id})">🖨</button>
                            <button class="btn btn-danger btn-small" onclick="eliminarArticulo(${art.id})">🗑</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            elemento.innerHTML = html;
        }

        function marcarEntregado(id) {
            const articulo = articulos.find(a => a.id === id);
            if (articulo && confirm(`¿Entregar el artículo "${articulo.descripcion}" a ${articulo.nombreCliente}?`)) {
                articulo.estado = 'Entregado';
                articulo.fechaEntrega = new Date().toLocaleString('es-CL');
                guardarEnStorage();
                actualizarInventario();
                mostrarNotificacion('✅ Artículo marcado como entregado');
            }
        }

        function marcarEnBodega(id) {
            const articulo = articulos.find(a => a.id === id);
            if (articulo && confirm(`¿Devolver el artículo a bodega?`)) {
                articulo.estado = 'En Bodega';
                articulo.fechaEntrega = null;
                guardarEnStorage();
                actualizarInventario();
                mostrarNotificacion('↩ Artículo devuelto a bodega');
            }
        }

        function eliminarArticulo(id) {
            const articulo = articulos.find(a => a.id === id);
            if (articulo && confirm(`¿Está seguro de eliminar el artículo "${articulo.descripcion}"?\n\nEsta acción no se puede deshacer.`)) {
                articulos = articulos.filter(a => a.id !== id);
                guardarEnStorage();
                actualizarInventario();
                buscarArticulos();
                mostrarNotificacion('🗑️ Artículo eliminado');
            }
        }

        function reimprimirTicket(id) {
            const articulo = articulos.find(a => a.id === id);
            if (articulo) {
                generarTicket(articulo);
                window.print();
            }
        }

        function buscarArticulos() {
            const termino = document.getElementById('campoBuscar').value.toLowerCase();
            
            if (termino === '') {
                document.getElementById('resultadosBusqueda').innerHTML = '<p style="text-align: center; padding: 40px; color: #999;">Ingrese un término de búsqueda...</p>';
                return;
            }

            const resultados = articulos.filter(a => 
                a.rut.toLowerCase().includes(termino) ||
                a.nombreCliente.toLowerCase().includes(termino) ||
                a.numeroBodega.toLowerCase().includes(termino) ||
                a.tipoArticulo.toLowerCase().includes(termino) ||
                a.descripcion.toLowerCase().includes(termino) ||
                a.id.toString().includes(termino)
            );

            if (resultados.length === 0) {
                document.getElementById('resultadosBusqueda').innerHTML = '<p style="text-align: center; padding: 40px; color: #999;">No se encontraron resultados.</p>';
            } else {
                mostrarTabla(resultados, 'resultadosBusqueda');
            }
        }

        function exportarDatos() {
            if (articulos.length === 0) {
                mostrarNotificacion('No hay datos para exportar', true);
                return;
            }

            let csv = 'ID,RUT,Cliente,Teléfono,Tipo,Descripción,Bodega,Fecha Ingreso,Estado,Fecha Entrega,Observaciones\n';
            
            articulos.forEach(art => {
                csv += `${art.id},"${art.rut}","${art.nombreCliente}","${art.telefono}","${art.tipoArticulo}","${art.descripcion}","${art.numeroBodega}","${art.fechaIngreso}","${art.estado}","${art.fechaEntrega || ''}","${art.observaciones}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `inventario_zapateria_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            mostrarNotificacion('📥 Datos exportados correctamente');
        }

        function limpiarDatos() {
            if (confirm('⚠️ ¿Está COMPLETAMENTE SEGURO de eliminar TODOS los datos?\n\nEsta acción NO se puede deshacer.\n\nSe recomienda exportar los datos antes de continuar.')) {
                if (confirm('Última confirmación: ¿Eliminar todo el inventario?')) {
                    articulos = [];
                    contadorId = 1;
                    guardarEnStorage();
                    actualizarInventario();
                    mostrarNotificacion('🗑️ Todos los datos han sido eliminados');
                }
            }
        }
    </script>
</body>
</html>
