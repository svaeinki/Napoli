<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Bodega - Zapatería</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="notification" id="notification"></div>

    <div class="container">
        <div class="header">
            <h1>🥾 Sistema de Bodega - Zapatería</h1>
            <p>Gestión profesional con SQLite + Dropbox + Pagos</p>
            <span class="badge">✅ Base de datos segura</span>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('ingresar')">➕ Ingresar Artículo</button>
            <button class="tab" onclick="showTab('inventario')">📦 Inventario</button>
            <button class="tab" onclick="showTab('buscar')">🔍 Buscar</button>
            <button class="tab" onclick="showTab('backup')">💾 Backups</button>
        </div>

        <div class="content">
            <!-- Los tabs se cargarán dinámicamente aquí -->
            <div id="ingresar" class="tab-content active"></div>
            <div id="inventario" class="tab-content"></div>
            <div id="buscar" class="tab-content"></div>
            <div id="backup" class="tab-content"></div>
        </div>
    </div>

    <!-- Contenedor para el ticket (se carga dinámicamente) -->
    <div id="ticketContainer"></div>

    <!-- Contenedor para el modal de pagos (se carga dinámicamente) -->
    <div id="modalContainer"></div>

    <!-- Cargar JavaScript modular -->
    <script src="js/templateLoader.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/validacion.js"></script>
    <script src="js/articulos.js"></script>
    <script src="js/inventario.js"></script>
    <script src="js/pagos.js"></script>
    <script src="js/busqueda.js"></script>
    <script src="js/backups.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
