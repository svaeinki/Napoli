<h2>Inventario Completo</h2>

<div class="stats">
    <div class="stat-card">
        <h3 id="totalArticulos">0</h3>
        <p>Total Artículos</p>
    </div>
    <div class="stat-card">
        <h3 id="enBodega">0</h3>
        <p>En Bodega</p>
    </div>
    <div class="stat-card">
        <h3 id="entregados">0</h3>
        <p>Entregados</p>
    </div>
</div>

<div class="toolbar">
    <div>
        <select id="filtroEstado" class="filter-select" onchange="aplicarFiltro()">
            <option value="todos">Todos los artículos</option>
            <option value="bodega">Solo en bodega</option>
            <option value="entregados">Solo entregados</option>
        </select>
    </div>
    <div>
        <button class="btn btn-secondary btn-small" onclick="actualizarInventarioManual()">🔄 Actualizar Inventario</button>
        <button class="btn btn-info btn-small" onclick="exportarDatos()">📥 Exportar CSV</button>
    </div>
</div>

<div class="table-container" id="tablaInventario"></div>
