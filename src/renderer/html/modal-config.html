<div id="modal-config" class="modal" style="display: none;" role="dialog" aria-modal="true" aria-label="Configuración de impresión">
    <div class="modal-content">
        <span class="close-modal" onclick="cerrarConfiguracion()" role="button" aria-label="Cerrar" tabindex="0">&times;</span>
        <h2>⚙️ Configuración de Impresión</h2>

        <div class="form-group full-width">
            <label>Encabezado del Ticket</label>
            <textarea id="configTicketHeader" rows="3"></textarea>
            <small>Puede usar saltos de línea.</small>
        </div>

        <div class="form-group full-width">
            <label>Pie de Página del Ticket</label>
            <textarea id="configTicketFooter" rows="3"></textarea>
        </div>

        <div class="config-actions">
            <div class="config-actions-row">
                <button class="btn btn-primary" onclick="guardarConfiguracionImpresora()">💾 Guardar Configuración</button>
                <button class="btn btn-info" onclick="pruebaImpresion()">🖨 Prueba</button>
            </div>
            <div class="config-actions-row config-actions-close">
                <button class="btn btn-secondary" onclick="cerrarConfiguracion()">Cerrar</button>
            </div>
        </div>
    </div>
</div>
