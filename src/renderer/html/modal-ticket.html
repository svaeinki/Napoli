<div id="modalTicket" class="modal" role="dialog" aria-modal="true" aria-label="Vista previa del ticket">
    <div class="modal-content modal-content-ticket">
        <span class="close" onclick="cerrarModalTicket()" role="button" aria-label="Cerrar" tabindex="0">&times;</span>
        <h2>Vista Previa del Ticket</h2>

        <div id="previewContainer" class="ticket-preview">
            <!-- Ticket content inject here -->
        </div>

        <div class="modal-actions">
            <button class="btn btn-primary" onclick="imprimirDesdePreview()">🖨 Imprimir</button>
            <button class="btn btn-secondary" onclick="cerrarModalTicket()">Cerrar</button>
        </div>
    </div>
</div>
