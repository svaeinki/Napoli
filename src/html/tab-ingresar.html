<h2>Ingresar Nuevo Artículo</h2>
<form id="formIngresar" onsubmit="ingresarArticulo(event)">
    <div class="form-grid">
        <div class="form-group">
            <label>RUT Cliente *</label>
            <input type="text" id="rut" placeholder="Ej: 12345678-9" required 
                   oninput="validarRUTEnTiempoReal(this)">
            <small id="rutError" class="rut-error" style="display: none;">RUT inválido</small>
        </div>

        <div class="form-group">
            <label>Nombre Cliente *</label>
            <input type="text" id="nombreCliente" placeholder="Nombre completo" required>
        </div>

        <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="telefono" placeholder="+56 9 1234 5678">
        </div>

        <div class="form-group">
            <label>Tipo de Servicio *</label>
            <select id="tipoArticulo" required>
                <option value="">Seleccione...</option>
                <option value="Reparación Zapatos">Reparación Zapatos</option>
                <option value="Reparación Botas">Reparación Botas</option>
                <option value="Reparación Bolso">Reparación Bolso</option>
                <option value="Reparación Cartera">Reparación Cartera</option>
                <option value="Reparación Cinturón">Reparación Cinturón</option>
                <option value="Reparación Maleta">Reparación Maleta</option>
                <option value="Cambio Suela">Cambio Suela</option>
                <option value="Cambio Taco">Cambio Taco</option>
                <option value="Costura">Costura</option>
                <option value="Limpieza">Limpieza</option>
                <option value="Teñido">Teñido</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label>Descripción del Artículo y Reparación *</label>
            <textarea id="descripcion" rows="3" placeholder="Ej: Zapatos negros marca XYZ, talla 40. Cambio de suela completa y costura lateral" required></textarea>
        </div>

        <div class="form-group">
            <label>Ubicación (opcional)</label>
            <input type="text" id="numeroBodega" placeholder="Ej: A-123">
        </div>

        <div class="form-group">
            <label>Valor del Servicio 💰</label>
            <input type="text" id="valorTotal" placeholder="Ej: 15000" oninput="formatearNumeroInput(this)">
            <small>Dejar vacío o en 0 si no aplica</small>
        </div>

        <div class="form-group">
            <label>Abono Inicial 💵</label>
            <input type="text" id="abonoInicial" placeholder="Ej: 5000" oninput="formatearNumeroInput(this); validarAbonoInline()">
            <small>Opcional - Se registrará al guardar</small>
            <div id="abonoError" class="field-error">El abono no puede ser mayor al valor total</div>
        </div>

        <div class="form-group">
            <label>Método de Pago del Abono</label>
            <select id="metodoPagoInicial">
                <option value="Efectivo">Efectivo</option>
                <option value="Tarjeta Débito">Tarjeta Débito</option>
                <option value="Tarjeta Crédito">Tarjeta Crédito</option>
                <option value="Transferencia">Transferencia</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="form-group full-width">
            <label>Observaciones</label>
            <input type="text" id="observaciones" placeholder="Información adicional (opcional)">
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">💾 Guardar e Imprimir Ticket</button>
        <button type="reset" class="btn btn-info">🔄 Limpiar Formulario</button>
    </div>
</form>
