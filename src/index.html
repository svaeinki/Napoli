<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- 'unsafe-inline' en script-src es necesario por los handlers onclick="..." del HTML. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Bodega - Napoli</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/ticket.css">
</head>

<body>
    <a href="#content-area" class="skip-link">Saltar al contenido</a>
    <div class="notification" id="notification" role="alert" aria-live="assertive"></div>

    <div class="container">
        <div class="header">
            <div class="header-content">
                <div>
                    <img src="assets/logo.png" alt="Napoli - Reparadora de Calzado" style="height: 150px; width: auto;">
                    <p>Gestión profesional con SQLite + Dropbox + Pagos</p>
                    <span class="badge">✅ Base de datos segura</span>
                </div>
                <button class="theme-toggle" onclick="abrirConfiguracion()" title="Configuración"
                    style="margin-right: 10px;">
                    ⚙️
                </button>
                <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab active" role="tab" aria-selected="true" aria-controls="ingresar" id="tab-ingresar" onclick="showTab('ingresar')">➕ Ingresar Artículo</button>
            <button class="tab" role="tab" aria-selected="false" aria-controls="inventario" id="tab-inventario" onclick="showTab('inventario')">📦 Inventario</button>
            <button class="tab" role="tab" aria-selected="false" aria-controls="buscar" id="tab-buscar" onclick="showTab('buscar')">🔍 Buscar</button>
            <button class="tab" role="tab" aria-selected="false" aria-controls="backup" id="tab-backup" onclick="showTab('backup')">💾 Backups</button>
        </div>

        <div class="content" id="content-area">
            <!-- Los tabs se cargarán dinámicamente aquí -->
            <div id="ingresar" class="tab-content active" role="tabpanel" aria-labelledby="tab-ingresar"></div>
            <div id="inventario" class="tab-content" role="tabpanel" aria-labelledby="tab-inventario"></div>
            <div id="buscar" class="tab-content" role="tabpanel" aria-labelledby="tab-buscar"></div>
            <div id="backup" class="tab-content" role="tabpanel" aria-labelledby="tab-backup"></div>
        </div>
    </div>

    <!-- Contenedor para el ticket (se carga dinámicamente) -->
    <div id="ticketContainer"></div>

    <!-- Contenedor para el modal de pagos (se carga dinámicamente) -->
    <div id="modalContainer"></div>

    <!-- Contenedor para el modal de ticket (se carga dinámicamente) -->
    <div id="modalTicketContainer"></div>

    <!-- Contenedor para el modal de configuración -->
    <div id="modalConfigContainer"></div>

    <!-- Contenedor para modal de confirmación async -->
    <div id="modalConfirmContainer"></div>

    <!-- Cargar JavaScript modular -->
    <script src="js/templateLoader.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/validacion.js"></script>
    <script src="js/articulos.js"></script>
    <script src="js/inventario.js"></script>
    <script src="js/pagos.js"></script>
    <script src="js/busqueda.js"></script>
    <script src="js/backups.js"></script>
    <script src="js/tickets.js"></script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
